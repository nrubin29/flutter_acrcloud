name: flutter_acrcloud
description: "A Flutter plugin for the ACRCloud music recognition API. This plugin provides a simple interface for using ACRCloud to recognize music from the device's microphone."
version: 2.0.1
homepage: https://github.com/nrubin29/flutter_acrcloud
repository: https://github.com/nrubin29/flutter_acrcloud
issue_tracker: https://github.com/nrubin29/flutter_acrcloud/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.16.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  pigeon: ^27.3.1

flutter:
  plugin:
    platforms:
      android:
        package: com.noahzrubin.flutter_acrcloud
        pluginClass: FlutterAcrcloudPlugin
      ios:
        pluginClass: FlutterAcrcloudPlugin
